version: '3.9'

services:
  postgres:
    image: postgres:17.4
    container_name: db_bontempo_store
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASE: bontempo_store_produtos, bontempo_store_clientes, bontempo_store_pedidos
    ports:
      - "5555:5432"
    volumes:
      - ./data:/var/lib/postgresql/data